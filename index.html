<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruta Full Stack — Panel de Progreso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg: #14161c;
  --bg-alt: #191c24;
  --surface: #1c1f29;
  --surface-2: #22262f;
  --border: #2b2f3b;
  --border-soft: #23262f;
  --text: #e9eaf0;
  --text-muted: #9297a8;
  --text-faint: #5b6072;
  --mint: #3ddc97;
  --mint-dim: rgba(61,220,151,.14);
  --amber: #ffb454;
  --amber-dim: rgba(255,180,84,.14);
  --slate: #4a4f5e;
  --slate-dim: rgba(74,79,94,.25);
  --blue: #7c9eff;
  --blue-dim: rgba(124,158,255,.14);
  --coral: #ff6b6b;
  --radius: 14px;
  --radius-sm: 9px;
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(124,158,255,.08), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(61,220,151,.06), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

::selection{background:var(--blue-dim); color:var(--text);}

/* ---------- Topbar ---------- */
.topbar{
  border-bottom:1px solid var(--border-soft);
  background:linear-gradient(180deg, rgba(28,31,41,.6), transparent);
  padding:36px 0 28px;
}
.topbar-inner{
  max-width:1180px; margin:0 auto; padding:0 28px;
  display:flex; align-items:center; justify-content:space-between; gap:32px; flex-wrap:wrap;
}
.eyebrow{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.14em;
  color:var(--blue); text-transform:uppercase; font-weight:600;
}
.brand h1{
  font-family:var(--font-display); font-weight:700; font-size:38px;
  letter-spacing:-.01em; margin-top:6px;
}

.hero-stats{ display:flex; align-items:center; gap:28px; }
.ring-wrap{ position:relative; width:104px; height:104px; flex:none; }
.ring{ width:100%; height:100%; transform:rotate(-90deg); }
.ring-track{ fill:none; stroke:var(--surface-2); stroke-width:9; }
.ring-fill{
  fill:none; stroke:var(--mint); stroke-width:9; stroke-linecap:round;
  stroke-dasharray:326.7; stroke-dashoffset:326.7;
  transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1), stroke .3s;
}
.ring-label{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
}
.ring-label #pctBig{ font-family:var(--font-display); font-size:22px; font-weight:700; }
.ring-sub{ font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}

.stat-chips{ display:flex; gap:10px; flex-wrap:wrap; }
.chip{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-sm);
  padding:10px 16px; min-width:104px;
  display:flex; flex-direction:column; gap:2px;
}
.chip span{ font-family:var(--font-mono); font-size:20px; font-weight:600; }
.chip label{ font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
.chip-done span{ color:var(--mint); }
.chip-progress span{ color:var(--amber); }
.chip-pending span{ color:var(--text-muted); }

/* ---------- Controls ---------- */
.controls{
  position:sticky; top:0; z-index:20;
  background:rgba(20,22,28,.88); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
}
.controls-inner{
  max-width:1180px; margin:0 auto; padding:14px 28px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.search-wrap{
  position:relative; flex:1 1 240px; min-width:200px;
  display:flex; align-items:center;
}
.search-wrap svg{ position:absolute; left:12px; color:var(--text-faint); pointer-events:none; }
.search-wrap input{
  width:100%; background:var(--surface); border:1px solid var(--border);
  border-radius:999px; padding:9px 14px 9px 36px; color:var(--text); font-size:13.5px;
  font-family:var(--font-body); outline:none; transition:border-color .2s;
}
.search-wrap input:focus{ border-color:var(--blue); }
.search-wrap input::placeholder{ color:var(--text-faint); }

.filter-chips{ display:flex; gap:6px; flex-wrap:wrap; }
.fchip{
  font-family:var(--font-body); font-size:12.5px; font-weight:600;
  background:var(--surface); border:1px solid var(--border); color:var(--text-muted);
  padding:8px 14px; border-radius:999px; cursor:pointer; transition:.15s;
}
.fchip:hover{ border-color:var(--blue); color:var(--text); }
.fchip.active{ background:var(--blue-dim); border-color:var(--blue); color:var(--blue); }

.expand-toggle{
  font-family:var(--font-mono); font-size:12px; font-weight:500;
  background:transparent; border:1px solid var(--border); color:var(--text-muted);
  padding:8px 14px; border-radius:999px; cursor:pointer; transition:.15s; white-space:nowrap;
}
.expand-toggle:hover{ border-color:var(--blue); color:var(--blue); }

/* ---------- Layout ---------- */
.layout{
  max-width:1180px; margin:0 auto; padding:28px 28px 10px;
  display:grid; grid-template-columns:200px 1fr; gap:28px; align-items:start;
}
.railnav{
  position:sticky; top:76px;
  border-left:2px solid var(--border);
  padding-left:18px;
  display:flex; flex-direction:column; gap:0;
}
.rail-item{
  position:relative; padding:11px 0; cursor:pointer; border:none; background:none;
  text-align:left; font-family:var(--font-body); color:var(--text-muted); font-size:12.5px;
  display:flex; flex-direction:column; gap:4px;
}
.rail-item::before{
  content:''; position:absolute; left:-23px; top:15px; width:9px; height:9px; border-radius:50%;
  background:var(--slate); border:2px solid var(--bg); transition:.2s;
}
.rail-item .rail-name{ font-weight:600; color:var(--text); }
.rail-item .rail-pct{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); }
.rail-item[data-done="true"]::before{ background:var(--mint); box-shadow:0 0 0 3px var(--mint-dim); }
.rail-item[data-partial="true"]::before{ background:var(--amber); box-shadow:0 0 0 3px var(--amber-dim); }
.rail-item:hover .rail-name{ color:var(--blue); }

/* ---------- Cycle cards ---------- */
.cycles{ display:flex; flex-direction:column; gap:16px; min-width:0; }
.cycle{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
  overflow:hidden; scroll-margin-top:80px;
}
.cycle-head{
  display:flex; align-items:center; gap:16px; padding:18px 20px; cursor:pointer;
  user-select:none;
}
.cycle-head:hover{ background:var(--surface-2); }
.cycle-toggle-icon{
  width:20px; height:20px; flex:none; color:var(--text-faint); transition:transform .25s;
}
.cycle.open .cycle-toggle-icon{ transform:rotate(90deg); }
.cycle-title{ flex:1; min-width:0; }
.cycle-title h2{
  font-family:var(--font-display); font-size:16.5px; font-weight:600; letter-spacing:-.01em;
}
.cycle-title .cycle-meta{ font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono); margin-top:2px; }
.cycle-bar-wrap{ width:140px; flex:none; display:flex; flex-direction:column; gap:5px; }
.cycle-bar-track{ height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
.cycle-bar-fill{ height:100%; border-radius:999px; background:var(--mint); transition:width .5s cubic-bezier(.4,0,.2,1); }
.cycle-bar-text{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); text-align:right; }

.cycle-body{ max-height:0; overflow:hidden; transition:max-height .35s ease; }
.cycle.open .cycle-body{ max-height:6000px; }
.cycle-body-inner{ padding:2px 20px 18px; }

.block-group{ margin-top:14px; }
.block-name{
  font-family:var(--font-mono); font-size:11.5px; font-weight:600; color:var(--blue);
  text-transform:uppercase; letter-spacing:.03em; padding:0 2px 8px; border-bottom:1px solid var(--border-soft); margin-bottom:8px;
}

.topic{
  display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:start;
  padding:10px 8px; border-radius:10px; transition:background .15s;
}
.topic:hover{ background:var(--surface-2); }
.topic + .topic{ border-top:1px dashed var(--border-soft); }

.status-btn{
  width:26px; height:26px; border-radius:8px; border:1.5px solid var(--border);
  background:var(--bg-alt); cursor:pointer; flex:none; margin-top:1px;
  display:flex; align-items:center; justify-content:center; transition:.15s;
}
.status-btn svg{ width:14px; height:14px; opacity:0; transition:.15s; }
.status-btn[data-status="Completado"]{ background:var(--mint); border-color:var(--mint); }
.status-btn[data-status="Completado"] svg{ opacity:1; color:#0c1712; }
.status-btn[data-status="En progreso"]{ background:var(--amber-dim); border-color:var(--amber); }
.status-btn[data-status="En progreso"]::after{ content:''; width:8px; height:8px; border-radius:2px; background:var(--amber); }
.status-btn[data-status="No iniciado"]:hover{ border-color:var(--blue); }

.topic-main .tema{ font-size:13.5px; font-weight:500; line-height:1.4; }
.topic-main .tema.done{ color:var(--text-muted); text-decoration:line-through; text-decoration-color:var(--border); }
.topic-links{ display:flex; gap:10px; margin-top:6px; flex-wrap:wrap; }
.topic-links a{
  font-size:11px; font-family:var(--font-mono); color:var(--text-faint); text-decoration:none;
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 7px; border-radius:999px;
  border:1px solid var(--border-soft); transition:.15s; max-width:230px;
}
.topic-links a span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.topic-links a:hover{ border-color:var(--blue); color:var(--blue); }
.topic-links a.study-link{ color:#93a5c9; }
.topic-links a.practice-link{ color:#8fd6b4; }

.topic-week{
  font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint);
  white-space:nowrap; margin-top:4px;
}

.hidden-row{ display:none !important; }

/* ---------- Footer / toast ---------- */
.foot{ max-width:1180px; margin:20px auto 60px; padding:0 28px; }
.foot p{ font-size:12px; color:var(--text-faint); line-height:1.6; }
.foot strong{ color:var(--text-muted); }

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  font-family:var(--font-mono); font-size:12px; padding:10px 18px; border-radius:999px;
  opacity:0; pointer-events:none; transition:.25s; z-index:50;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ---------- Responsive ---------- */
@media (max-width: 860px){
  .layout{ grid-template-columns:1fr; }
  .railnav{
    position:static; border-left:none; border-bottom:1px solid var(--border);
    flex-direction:row; overflow-x:auto; padding:0 0 14px; gap:18px;
  }
  .rail-item{ flex:none; padding:0; }
  .rail-item::before{ left:50%; top:-12px; transform:translateX(-50%); }
  .brand h1{ font-size:28px; }
  .hero-stats{ gap:16px; }
  .stat-chips{ gap:8px; }
  .chip{ min-width:84px; padding:8px 12px; }
  .cycle-bar-wrap{ width:90px; }
}
@media (max-width:560px){
  .topic{ grid-template-columns:auto 1fr; }
  .topic-week{ grid-column:2; }
}

@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; scroll-behavior:auto !important; }
}

</style>
</head>

<div class="app">

    <div class="topbar-inner">
      <div class="brand">
        <span class="eyebrow">PROGRAMA DE FORMACIÓN</span>
        <h1>Ruta Full Stack</h1>
      </div>

      <div class="hero-stats">

          <svg viewBox="0 0 120 120" class="ring">
            <circle class="ring-track" cx="60" cy="60" r="52"></circle>
            <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="ring-label">
            <span id="pctBig">0%</span>
            <span class="ring-sub">completado</span>
          </div>
        </div>
        <div class="stat-chips">
          <div class="chip chip-done"><span id="countDone">0</span><label>Completados</label></div>
          <div class="chip chip-progress"><span id="countProgress">0</span><label>En progreso</label></div>
          <div class="chip chip-pending"><span id="countPending">0</span><label>Pendientes</label></div>
        </div>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="controls-inner">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="text" placeholder="Buscar un tema, bloque o ciclo…" autocomplete="off">
      </div>
      <div class="filter-chips" id="statusFilters">
        <button class="fchip active" data-filter="todos">Todos</button>
        <button class="fchip" data-filter="No iniciado">Pendientes</button>
        <button class="fchip" data-filter="En progreso">En progreso</button>
        <button class="fchip" data-filter="Completado">Completados</button>
      </div>
      <button class="expand-toggle" id="expandToggle">Expandir todo</button>
    </div>
  </div>

  <main class="layout">
    <nav class="railnav" id="railnav" aria-label="Navegación de ciclos"></nav>

    <section class="cycles" id="cyclesContainer"></section>
  </main>

  <footer class="foot">
    <p>Tu progreso se guarda automáticamente en este navegador. Acompaña al programa <strong>Full Stack Developer</strong> — cada ítem enlaza a su recurso de estudio y a dónde practicarlo.</p>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>

const RAW = JSON.parse(document.getElementById('dataStore').textContent);
const STORAGE_KEY = 'progress-v1';
let state = {}; // {id: status}
let statusFilter = 'todos';
let searchTerm = '';
let allExpanded = false;

const CYCLE_ORDER = [...new Set(RAW.map(i => i.ciclo))];

function statusOf(id){ return state[id] || 'No iniciado'; }

function nextStatus(s){
  if(s === 'No iniciado') return 'En progreso';
  if(s === 'En progreso') return 'Completado';
  return 'No iniciado';
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value) state = JSON.parse(res.value);
  }catch(e){ state = {}; }
}

let saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
    catch(e){ console.error('No se pudo guardar el progreso', e); }
  }, 250);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1600);
}

function groupByCycleThenBlock(items){
  const map = new Map();
  for(const it of items){
    if(!map.has(it.ciclo)) map.set(it.ciclo, new Map());
    const bMap = map.get(it.ciclo);
    if(!bMap.has(it.bloque)) bMap.set(it.bloque, []);
    bMap.get(it.bloque).push(it);
  }
  return map;
}

function cycleStats(ciclo){
  const items = RAW.filter(i => i.ciclo === ciclo);
  const total = items.length;
  const done = items.filter(i => statusOf(i.id) === 'Completado').length;
  const prog = items.filter(i => statusOf(i.id) === 'En progreso').length;
  return { total, done, prog, pct: total ? Math.round((done/total)*100) : 0 };
}

function overallStats(){
  const total = RAW.length;
  const done = RAW.filter(i => statusOf(i.id) === 'Completado').length;
  const prog = RAW.filter(i => statusOf(i.id) === 'En progreso').length;
  const pending = total - done - prog;
  return { total, done, prog, pending, pct: total ? Math.round((done/total)*100) : 0 };
}

function iconLink(){
  return '<svg viewBox="0 0 24 24" width="10" height="10" fill="none"><path d="M7 17 17 7M17 7H9M17 7v8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function checkIcon(){
  return '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function matchesFilters(item){
  if(statusFilter !== 'todos' && statusOf(item.id) !== statusFilter) return false;
  if(searchTerm){
    const hay = (item.tema + ' ' + item.bloque + ' ' + item.ciclo + ' ' + item.estudioLabel + ' ' + item.practicaLabel).toLowerCase();
    if(!hay.includes(searchTerm)) return false;
  }
  return true;
}

function render(){
  const container = document.getElementById('cyclesContainer');
  const rail = document.getElementById('railnav');
  container.innerHTML = '';
  rail.innerHTML = '';

  const grouped = groupByCycleThenBlock(RAW);

  CYCLE_ORDER.forEach((ciclo, idx) => {
    const stats = cycleStats(ciclo);
    const anchorId = 'cycle-' + idx;

    // Rail nav item
    const railBtn = document.createElement('button');
    railBtn.className = 'rail-item';
    railBtn.dataset.done = stats.pct === 100 ? 'true' : 'false';
    railBtn.dataset.partial = (stats.pct > 0 && stats.pct < 100) ? 'true' : 'false';
    railBtn.innerHTML = `<span class="rail-name">${ciclo.replace(/^Ciclo \d+ - /,'')}</span><span class="rail-pct">${stats.pct}% · ${stats.done}/${stats.total}</span>`;
    railBtn.addEventListener('click', () => {
      document.getElementById(anchorId).scrollIntoView({ behavior:'smooth', block:'start' });
      openCycle(anchorId, true);
    });
    rail.appendChild(railBtn);

    // Cycle card
    const cycleEl = document.createElement('div');
    cycleEl.className = 'cycle' + (allExpanded || idx === 0 ? ' open' : '');
    cycleEl.id = anchorId;

    const head = document.createElement('div');
    head.className = 'cycle-head';
    head.innerHTML = `
      <svg class="cycle-toggle-icon" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="cycle-title">
        <h2>${ciclo}</h2>
        <div class="cycle-meta">${stats.total} temas · ${stats.done} completados</div>
      </div>
      <div class="cycle-bar-wrap">
        <div class="cycle-bar-track"><div class="cycle-bar-fill" style="width:${stats.pct}%"></div></div>
        <div class="cycle-bar-text">${stats.pct}%</div>
      </div>
    `;
    head.addEventListener('click', () => cycleEl.classList.toggle('open'));
    cycleEl.appendChild(head);

    const body = document.createElement('div');
    body.className = 'cycle-body';
    const bodyInner = document.createElement('div');
    bodyInner.className = 'cycle-body-inner';

    const blocks = grouped.get(ciclo);
    let cycleHasVisible = false;

    blocks.forEach((items, bloque) => {
      const visibleItems = items.filter(matchesFilters);
      if(visibleItems.length === 0) return;
      cycleHasVisible = true;

      const blockEl = document.createElement('div');
      blockEl.className = 'block-group';
      blockEl.innerHTML = `<div class="block-name">${bloque}</div>`;

      visibleItems.forEach(item => {
        const st = statusOf(item.id);
        const row = document.createElement('div');
        row.className = 'topic';

        const studyLink = item.estudioLink
          ? `<a class="study-link" href="${item.estudioLink}" target="_blank" rel="noopener">${iconLink()}<span>${item.estudioLabel}</span></a>`
          : (item.estudioLabel ? `<span class="topic-links-plain" style="font-size:11px;font-family:var(--font-mono);color:var(--text-faint);">${item.estudioLabel}</span>` : '');
        const practiceLink = item.practicaLink
          ? `<a class="practice-link" href="${item.practicaLink}" target="_blank" rel="noopener">${iconLink()}<span>${item.practicaLabel}</span></a>`
          : (item.practicaLabel ? `<span class="topic-links-plain" style="font-size:11px;font-family:var(--font-mono);color:var(--text-faint);">${item.practicaLabel}</span>` : '');

        row.innerHTML = `
          <button class="status-btn" data-status="${st}" data-id="${item.id}" title="Click para cambiar estado">${checkIcon()}</button>
          <div class="topic-main">
            <div class="tema ${st==='Completado'?'done':''}">${item.tema}</div>
            <div class="topic-links">${studyLink}${practiceLink}</div>
          </div>
          <div class="topic-week">${item.semana}</div>
        `;
        bodyInner.appendChild(row);
        blockEl.appendChild(row);
      });

      bodyInner.appendChild(blockEl);
    });

    if(!cycleHasVisible){
      bodyInner.innerHTML = '<p style="color:var(--text-faint);font-size:12.5px;padding:14px 2px;">Ningún tema de este ciclo coincide con el filtro actual.</p>';
    }

    body.appendChild(bodyInner);
    cycleEl.appendChild(body);
    container.appendChild(cycleEl);
  });

  // listeners de status
  container.querySelectorAll('.status-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const cur = statusOf(id);
      const nxt = nextStatus(cur);
      state[id] = nxt;
      saveState();
      updateHero();
      render();
      if(nxt === 'Completado') showToast('Marcado como completado');
    });
  });

  updateHero();
}

function openCycle(id, force){
  const el = document.getElementById(id);
  if(el && (force || !el.classList.contains('open'))) el.classList.add('open');
}

function updateHero(){
  const s = overallStats();
  document.getElementById('pctBig').textContent = s.pct + '%';
  document.getElementById('countDone').textContent = s.done;
  document.getElementById('countProgress').textContent = s.prog;
  document.getElementById('countPending').textContent = s.pending;

  const circumference = 326.7;
  const offset = circumference - (s.pct/100)*circumference;
  document.getElementById('ringFill').style.strokeDashoffset = offset;
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

document.getElementById('statusFilters').addEventListener('click', (e) => {
  const btn = e.target.closest('.fchip');
  if(!btn) return;
  document.querySelectorAll('.fchip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  statusFilter = btn.dataset.filter;
  render();
});

document.getElementById('expandToggle').addEventListener('click', (e) => {
  allExpanded = !allExpanded;
  e.target.textContent = allExpanded ? 'Colapsar todo' : 'Expandir todo';
  document.querySelectorAll('.cycle').forEach(c => {
    if(allExpanded) c.classList.add('open'); else c.classList.remove('open');
  });
});

(async function init(){
  await loadState();
  render();
})();

</script>
</body>
</html>
